name: check

# Local validation is the Sambafied default; hosted runs are explicit only.
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy 

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-features --workspace
        env:
          RUSTFLAGS: "-Dwarnings"
  
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check
